<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            position: relative;
            padding: 10px;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* Responsive Iframe Container */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Rasio aspek 16:9 */
            height: 0;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 1. Styling untuk In-Page Push Pojok Bawah (Responsive) */
        #inPagePush {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 300px;
            max-width: 45vw; /* Otomatis mengecil jika layar HP kecil */
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.8);
            z-index: 9999;
            display: none;
            overflow: hidden;
            animation: slideIn 0.4s ease-out forwards;
        }

        /* 2. Styling untuk In-Page Push di Tengah (Responsive Otomatis HP & Desktop) */
        #inPagePushCenter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 360px; /* Pas di HP maupun Desktop */
            background: #1e1e1e;
            border: 2px solid #555;
            border-radius: 10px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            z-index: 10000;
            display: none;
            overflow: hidden;
            animation: scaleIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .push-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #2b2b2b;
            font-size: 11px;
            color: #ccc;
        }

        .push-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
        }

        .push-body {
            padding: 10px;
            cursor: pointer;
        }

        .push-video-container {
            width: 100%;
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
        }

        /* Ukuran video iklan menyesuaikan otomatis */
        .push-video-container video {
            width: 100%;
            height: 130px; 
            object-fit: cover;
            display: block;
        }

        .push-title {
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
            color: #ffcc00;
            text-align: center;
        }

        /* Penyesuaian khusus untuk layar HP yang sangat kecil */
        @media (max-width: 480px) {
            #inPagePush {
                width: 42vw;
                bottom: 10px;
                right: 10px;
            }
            .push-video-container video {
                height: 100px;
            }
            .push-title {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="player-wrapper">
            <!-- Video Utama (Embed Trbnvideo) -->
            <div class="video-container">
                <iframe src="https://trbnvideo.live/e/nQ29SZ0p" allowfullscreen></iframe>
            </div>

            <!-- In-Page Push 1: Pojok Bawah (Link Iklan 2) -->
            <div id="inPagePush">
                <div class="push-header">
                    <span>Sponsored Ad</span>
                    <button class="push-close" onclick="closePush(event, 'bottom')">&times;</button>
                </div>
                <div class="push-body" onclick="triggerSmartlink()">
                    <div class="push-video-container">
                        <video id="adVideo1" autoplay muted loop playsinline>
                            <source src="https://imglink.cc/cdn/Age9PQjKpK.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="push-title">🔥 Klik Disini Untuk Nonton Full Video!</div>
                </div>
            </div>

            <!-- In-Page Push 2: Ditengah Layar (Link Iklan 1) -->
            <div id="inPagePushCenter">
                <div class="push-header">
                    <span>Special Offer - Sponsored</span>
                    <button class="push-close" onclick="closePush(event, 'center')">&times;</button>
                </div>
                <div class="push-body" onclick="triggerSmartlink()">
                    <div class="push-video-container">
                        <video id="adVideo2" autoplay muted loop playsinline>
                            <source src="https://imglink.cc/cdn/O6MFUqvvr1.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="push-title">⚠️ KLIK DISINI SEKARANG (FULL 34 MENIT)!</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const inPagePush = document.getElementById('inPagePush');
        const inPagePushCenter = document.getElementById('inPagePushCenter');
        const adVideo1 = document.getElementById('adVideo1');
        const adVideo2 = document.getElementById('adVideo2');
        
        // Interval kemunculan iklan setiap 7 detik
        const intervalSeconds = 7000; 
        const smartlinkURL = "https://www.profitableratecpmnetwork.com/hh55phupz7?key=035891703dff41ba6e0911050a5989af";

        let adToggle = 0;

        // Fungsi memunculkan iklan secara bergantian (bergiliran)
        setInterval(function() {
            if ((inPagePush.style.display === 'none' || inPagePush.style.display === '') && 
                (inPagePushCenter.style.display === 'none' || inPagePushCenter.style.display === '')) {
                
                if (adToggle === 0) {
                    inPagePushCenter.style.display = 'block';
                    adVideo2.play().catch(e => console.log("Autoplay blocked:", e));
                    adToggle = 1; 
                } else {
                    inPagePush.style.display = 'block';
                    adVideo1.play().catch(e => console.log("Autoplay blocked:", e));
                    adToggle = 0; 
                }
            }
        }, intervalSeconds);

        // Fungsi saat area iklan diklik
        function triggerSmartlink() {
            window.open(smartlinkURL, '_blank');
        }

        // Fungsi saat tombol X diklik (Membuka Smartlink & Menutup Banner)
        function closePush(event, type) {
            event.stopPropagation();
            window.open(smartlinkURL, '_blank');
            
            if (type === 'bottom') {
                inPagePush.style.display = 'none';
                adVideo1.pause();
            } else if (type === 'center') {
                inPagePushCenter.style.display = 'none';
                adVideo2.pause();
            }
        }
    </script>

</body>
</html>
